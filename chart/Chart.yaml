apiVersion: v2
name: damap-chart
description: A tool to create machine-actionable data management plans.
type: application

version: 0.4.1
appVersion: "5.1.1"

kubeVersion: ">=1.25.0"

home: https://damap.org
sources:
  - https://github.com/damap-org/damap-backend
  - https://github.com/damap-org/damap-frontend
  - https://github.com/damap-org/damap-chart

keywords:
  - damap
  - data-management
  - dmp
  - research
  - pure
  - keycloak
  - oidc
  - openid

maintainers:
  - name: DAMAP Team
    email: info@damap.org

icon: https://damap.org/logo.svg

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: added
      description: Make Keycloak proxy headers and dynamic backchannel URLs configurable
    - kind: changed
      description: Bump DAMAP backend and frontend to 5.1.1
    - kind: changed
      description: Bump Keycloak to 26.7
    - kind: fixed
      description: Preserve the generated Keycloak database password on upgrade
    - kind: fixed
      description: Use /auth in OIDC URLs only when DAMAP and Keycloak share a hostname
    - kind: fixed
      description: Prevent premature PostgreSQL restarts with startup probes and longer liveness timeouts
